# ------------------------------------------------------------------
#  UsefulTrades - extra villager trades
#
#  Vanilla trades stay. Each trade below gets ADDED once a villager
#  reaches its level:
#    1 = Novice   2 = Apprentice   3 = Journeyman   4 = Expert   5 = Master
#
#  After editing this file, run /usefultrades reload (or restart).
#  Villagers pick up the change the next time someone opens their
#  trades, including villagers that are already levelled up.
#
#  Fields for each trade:
#    level:        1-5
#    item:         what the villager sells, "<amount> <item>"
#                  e.g. "1 netherite_upgrade_smithing_template"
#    book:         OR sell an enchanted book, "<enchantment> <level>"
#                  e.g. "mending 1", "efficiency 5"
#    map:          OR sell an explorer map to the nearest structure,
#                  e.g. "stronghold", "ancient_city", "trial_chambers".
#                  Bastion/fortress maps are Nether maps: they point to
#                  the bastion near the matching Nether spot and only
#                  work while you're in the Nether.
#                  Each villager draws its map once, the first time the
#                  trade shows up. If there's no such structure within
#                  100 chunks, that villager just doesn't sell it.
#    map-icon:     optional marker on the map, e.g. "red_x" (default),
#                  "target_x", "trial_chambers", "mansion", "monument"
#    price:        first cost, "<amount> <item>", e.g. "24 emerald"
#    price2:       optional second cost, e.g. "1 book"
#    max-uses:     trades before a restock (default 12; the
#                  InfiniteVillagerTrading plugin makes it unlimited)
#    villager-xp:  how much the villager levels up per trade
#
#  Item and enchantment names are the same IDs /give uses.
#  To add trades for another job, add a section like "cleric:".
#
#  The "wandering_trader" section works the same way, except wandering
#  traders have no levels: every trade in it is always added.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
#  Less grinding (added in 1.2.0)
# ------------------------------------------------------------------

# Every villager and wandering trader trade costs this many times its
# normal price (both costs, never more than a full stack). 1 = normal
# vanilla prices. 2 = double (8 iron for an emerald instead of 4).
# Applies to vanilla trades AND the trades below (write the trades below
# at normal price). Villagers switch over the next time someone opens
# their trades, including undoing an older multiplier.
cost-multiplier: 1

# Mobs killed by a player drop this many times their normal loot.
# Mob farms that kill without a player, XP, shearing and crops stay normal.
# Anything a mob was wearing, holding or carrying, and unstackable drops
# (armor, tools, totems), drop once, so nothing can be duplicated.
mob-drops:
  multiplier: 5
  only-player-kills: true
  never-multiply:
    - nether_star

# Anvils: two enchantments of the same level make the next level, past
# vanilla's max (Fortune 3 + Fortune 3 = Fortune 4), up to max-level.
# Enchantments with only one level (Mending, Silk Touch) stay at 1.
# The cost never goes past max-cost, so "Too Expensive" never shows.
anvil:
  max-level: 10
  max-cost: 39
  # Lower caps for some enchantments (anything not listed goes to max-level,
  # e.g. efficiency and unbreaking). Items already above a cap keep their
  # level; the anvil just won't combine them higher.
  level-caps:
    # Loot: more than 5 makes one kill or one ore too rich.
    fortune: 5
    looting: 5
    luck_of_the_sea: 5
    # Weapons and armor: 7 at most.
    sharpness: 7
    smite: 7
    bane_of_arthropods: 7
    power: 7
    impaling: 7
    density: 7
    piercing: 7
    sweeping_edge: 7
    protection: 7
    fire_protection: 7
    blast_protection: 7
    projectile_protection: 7
    feather_falling: 7
    # Kept near vanilla: breach 7 would ignore all armor, thorns stacks on
    # every armor piece, knockback/punch launch players across the map,
    # fire aspect burns too long, wind burst, lunge and riptide fling players
    # (loading lots of chunks), frost walker freezes a huge area.
    breach: 4
    thorns: 3
    knockback: 3
    punch: 3
    fire_aspect: 3
    wind_burst: 3
    lunge: 3
    riptide: 4
    frost_walker: 3
    # quick charge 5+ makes crossbows stop working, lure 6+ stops fish biting.
    quick_charge: 4
    lure: 5

# Villager fixes.
villagers:
  # Trades always cost their base price. InfiniteVillagerTrading's endless
  # trades made vanilla's "demand" number overflow, so prices jumped to a
  # full stack of emeralds or iron after villagers restocked.
  steady-prices: true
  # true = hitting or killing villagers doesn't make them raise prices or
  # send iron golems after you, and old grudges are cleared. The discount
  # for curing a zombie villager still works. Off: vanilla grudges.
  no-grudges: false

